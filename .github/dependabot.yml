version: 2
updates:
  # GitHub Actions 版本更新（含后续 SHA pin 迁移的自动升级入口）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Android 客户端依赖（version catalog 与 build-logic 均在 client/ 下）
  - package-ecosystem: gradle
    directory: /client
    schedule:
      interval: weekly
    labels:
      - dependencies
      - client

  # 服务端依赖（bun lockfile）
  - package-ecosystem: bun
    directory: /server
    schedule:
      interval: weekly
    labels:
      - dependencies
      - server
